<!-- min-vh-100 ocupa a altura toda da tela e centraliza o card -->
<div class="min-vh-100 d-flex align-items-center justify-content-center px-3">

  <div class="card border-0 shadow" style="max-width: 380px; width: 100%;">
    <div class="card-body p-4">

      <!-- MARCA -->
      <div class="text-center mb-3">
        <div class="d-flex align-items-center justify-content-center gap-2 marca">
          <!-- LOGO: sorriso + dente (mesmo SVG do menu) -->
          <svg class="logo-consultorio fs-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.6 14.2c1.9 4.2 5 6.3 8.4 6.3s6.5-2.1 8.4-6.3" stroke-width="1.9"></path>
            <path transform="translate(6.6 1.4) scale(0.45)" stroke-width="3.8" d="M12 5.6C10.6 4.2 9.2 3.6 7.6 3.6C5 3.6 3.4 5.6 3.4 8.2C3.4 10.4 4.6 12 5.2 14.2C5.8 16.4 6 19.6 7.4 20.6C8.7 21.5 9.4 20 9.8 18.2C10.1 16.7 10.6 15 12 15C13.4 15 13.9 16.7 14.2 18.2C14.6 20 15.3 21.5 16.6 20.6C18 19.6 18.2 16.4 18.8 14.2C19.4 12 20.6 10.4 20.6 8.2C20.6 5.6 19 3.6 16.4 3.6C14.8 3.6 13.4 4.2 12 5.6Z"></path>
          </svg>
          <span class="fs-4 fw-semibold">Consultório</span>
        </div>
        <p class="text-muted small mb-0">Acesse sua conta</p>
      </div>

      <!-- ngSubmit dispara no Enter e no botão type="submit" -->
      <form [formGroup]="form" (ngSubmit)="entrar()">

        <!-- LOGIN -->
        <label for="login" class="form-label">Login</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input
              type="text"
              id="login"
              class="form-control"
              formControlName="login"
              [class.is-invalid]="form.get('login')?.invalid && form.get('login')?.touched">
        </div>

        <!-- SENHA (o olho alterna o type entre password e text) -->
        <label for="senha" class="form-label">Senha</label>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input
              [type]="verSenha() ? 'text' : 'password'"
              id="senha"
              class="form-control"
              formControlName="senha"
              autocomplete="current-password"
              [class.is-invalid]="form.get('senha')?.invalid && form.get('senha')?.touched">
          <button type="button" class="btn btn-outline-secondary"
                  (click)="verSenha.set(!verSenha())">
            <i class="bi" [class.bi-eye]="!verSenha()" [class.bi-eye-slash]="verSenha()"></i>
          </button>
        </div>

        <!-- ERRO -->
        @if (erro()) {
          <div class="alert alert-danger py-2 small">{{ erro() }}</div>
        }

        <!-- BOTÃO -->
        <button type="submit" class="btn btn-success w-100" [disabled]="carregando()">
          @if (carregando()) {
            <span class="spinner-border spinner-border-sm me-1"></span> Entrando...
          } @else {
            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
          }
        </button>

      </form>
    </div>
  </div>
</div>
